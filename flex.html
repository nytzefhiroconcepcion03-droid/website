<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox Tutorial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            padding: 20px;
        }

        .parent {
            display: flex;
            min-height: 500px;
            border: 4px solid purple;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: start;
            align-items: start;
            align-content: space-between;
            gap: 25px;
        }

        .child {
            padding: 20px;
            background-color: #4caf50;
            color: white;
            font-weight: bold;

            flex-grow: 0;
            flex-shrink: 1;
            flex-basis: auto;
        }

        .child:nth-child(2) {
            background-color: #2196f3;
            flex: 2 1 auto;
            order: 4;
        }

        .child:nth-child(3) {
            background-color: #ff9800;
            flex-grow: 1;
            align-self: end;
        }

        .child:nth-child(4) {
            background-color: #9c27b0;
        }
    </style>
</head>

<body>
    <a href="portfolio.html">LANDING PAGE</a>
    <div class="parent">
        <div class="child">Oldest Child</div>
        <div class="child">The Peacemaker Child</div>
        <div class="child">Rebel Child</div>
        <div class="child">Favorite Child</div>
    </div>

</body>

</html>
