<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo on JavaScript</title>
    <script>
        console.log("Nyt Zefhiro C. Concepcion");
        var x = 10;
        var y = 20;
        var sum = x + y;
        var sub = x - y;
        var mul = x * y;
        var div = x / y;
        var mod = x % y;
        console.log(x + "+" + y + "=" + sum);
        console.log(x + "-" + y + "=" + sub);
        console.log(x + "*" + y + "=" + mul);
        console.log(x + "/" + y + "=" + div);
        console.log(x + "%" + y + "=" + mod);
        console.log(x + "<" + y + "=" + (x < y) );
        console.log(x + ">" + y + "=" + (x > y) );
        console.log(x + "==" + y + "=" + (x == y) );
        console.log(x + "!=" + y + "=" + (x != y) );
        console.log(x + "<=" + y + "=" + (x <= y) );
        console.log(x + ">=" + y + "=" + (x >= y) );
    </script>
</head>
<body>
    <h1> JavaScript</h1>
    <a href = "index.html"> BACK TO THE LANDING PAGE</a> 
</body>
</html>
