<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
            max-width: 80px;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid black;
            padding: 8px 12px;
            text-align: left;
            vertical-align: middle;
        }
        th {
            background-color: #f2f2f2;
            text-align: center;
        }
        td img {
            width: 100px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <a href = "index.html"> LANDING PAGE</a>
    <table id="studentTable">
        <thead>
            <tr>
                <th>LRN</th>
                <th>NAME</th>
                <th>AGE</th>
                <th>SECTION</th>
                <th>IMAGES</th>
            </tr>
        </thead>
        <tbody id = "output">
                        
        </tbody>
    </table>

    <script src="jsonScript.js"></script>
</body>
</html>
