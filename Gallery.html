        body {

        }
        h1 { text-align: center; color: #1F3864; }
            .carousel {
            max-width: 800px;
            margin: 0 auto;
        }
        .slides {
            position: relative;
            aspect-ratio: 16 / 9; /* keeps the shape on any screen width */
            overflow: hidden;
            background: #000;
            border-radius: 8px;
        }
            slide {
            position: absolute; /* stack all slides in the same spot */
            inset: 0;
            margin: 0;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* fill the box without stretching */
            display: block;
        }



            .slide figcaption {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            }
            .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            border: none;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 24px;
            padding: 10px 14px;
            cursor: pointer;
            }
            .nav:hover { background: rgba(0, 0, 0, 0.8); }
            .prev { left: 8px; }
            .next { right: 8px; }
            .dots { text-align: center; padding: 12px 0; }
            .dot {
            width: 12px;
            height: 12px;
            margin: 0 5px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: #b8b8b8;
            cursor: pointer;
            }
            .dot.active { background: #1F3864; }
    </style>

    <script>
    $(document).ready(function () {
    // 1. Cache elements and settings
    const $carousel = $("#carousel");
    const $slides = $carousel.find(".slide");
    const $dotsBox = $carousel.find(".dots");
    const total = $slides.length;
    const FADE_TIME = 500; // milliseconds
    const DELAY = 4000; // time between automatic slides
    let current = 0; // index of the visible slide
    let timer = null; // holds the autoplay timer
    // 2. Initial state: show only the first slide
    $slides.hide().eq(0).show();
    // 3. Create one dot per slide
    $slides.each(function (i) {
    $("<button>")
    .attr({ type: "button", "aria-label": "Go to slide " + (i + 1) })
    .addClass("dot" + (i === 0 ? " active" : ""))
    .data("index", i)
    .appendTo($dotsBox);
    });
    const $dots = $dotsBox.find(".dot");
    // 4. Show a specific slide
    function showSlide(index) {
    if (index === current) return; // nothing to do
    $slides.eq(current).stop(true, true).fadeOut(FADE_TIME);
    $slides.eq(index).stop(true, true).fadeIn(FADE_TIME);
    $dots.removeClass("active").eq(index).addClass("active");
    current = index;
    }
    function nextSlide() { showSlide((current + 1) % total); }
    function prevSlide() { showSlide((current - 1 + total) % total); }
    // 5. Controls
    $carousel.on("click", ".next", nextSlide);
    $carousel.on("click", ".prev", prevSlide);
    $dotsBox.on("click", ".dot", function () {
    showSlide($(this).data("index"));
    });
    // 6. Autoplay (pauses on hover)
    function startAutoplay() {
    stopAutoplay(); // avoid duplicate timers
    timer = setInterval(nextSlide, DELAY);
    }
    function stopAutoplay() {
    clearInterval(timer);
    }
    $carousel.on("mouseenter", stopAutoplay)

    .on("mouseleave", startAutoplay);
    startAutoplay();
    // 7. Keyboard control
    $(document).on("keydown", function (event) {
    if (event.key === "ArrowRight") {
    nextSlide();
    } else if (event.key === "ArrowLeft") {
    prevSlide();
    }
    });
    });
    </script>
