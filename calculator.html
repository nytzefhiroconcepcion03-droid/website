<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum Calculator</title>
    <script src="calculation.js" defer></script>
    <style>
        table {
            border: 3px solid #4f5b73;
            border-collapse: collapse;
        }
        td {
            border: 1px solid #8c95a6;
            padding: 14px 18px;
        }
        input[type="text"] {
            width: 220px;
            padding: 8px 10px;
            border: 1px solid #8c95a6;
            border-radius: 3px;
        }
        input[type="button"],
        input[type="reset"] {
            padding: 12px 24px;
            background-color: #8a95a3;
            color: #222;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <center>
        <h1>Calculator</h1>
        <form>
            <table>
                <tr>
                    <td>Enter First Number:</td>
                    <td><input type="text" id="txtFirst" placeholder="Enter Your Number"></td>
                </tr>
                <tr>
                    <td>Enter Second Number:</td>
                    <td><input type="text" id="txtSecond" placeholder="Enter Your Number"></td>
                </tr>
                <tr>
                    <td>Result:</td>
                    <td><input type="text" id="txtResults" placeholder="Result" readonly></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="button" id="btnCompute" value="Compute">
                        <input type="reset" id="btnReset" value="Reset">
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="center"><a href="index.html">BACK TO THE LANDING PAGE</a></td>
                </tr>
            </table>
        </form>
    </center>
</body>
</html>
